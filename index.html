/* ---------- KONSTANTA DASAR ---------- */
const W=1280,H=720,TAU=Math.PI*2,DURATION=240;
const FONT="'Inter','Segoe UI',Arial,sans-serif";
const canvas=document.getElementById('c');
const mainCtx=canvas.getContext('2d');

/* ---------- PALET WARNA KONSISTEN ---------- */
const C={
  bgDark:'#15181f',clay:'#c67b5c',clayDark:'#9c5a40',skin:'#e6b28c',
  paper:'#f0e6d2',paperDark:'#ddd0b8',cream:'#f5edd9',rust:'#8a4a2e',

};
// Cue waktu VO sesuai timecode dokumen (untuk referensi timing):
const VO_CUES=[
 {seg:'Pembuka',start:0,end:25},

/* ---------- UTIL MATEMATIKA & EASING ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const norm=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const easeOutQuad=t=>1-(1-t)*(1-t);
const easeInCubic=t=>t*t*t;
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeInOutCubic=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
function appear(lt,t0,d){return easeOutCubic(norm(lt,t0,t0+d));}
// hash deterministik (bukan Math.random)
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
// micro-jitter stop motion (kuantisasi 12 pose/detik)
function jitter(seed,t,amp=1){const f=Math.floor(t*12);return{x:(hash(seed+f*3.1)-0.5)*amp,y:(hash(seed+f*5.7)-0.5)*amp};}

/* ---------- UTIL WARNA ---------- */
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>{v=Math.max(0,Math.min(255,Math.round(v)));return v.toString(16).padStart(2,'0');}).join('');}
function lighten(hex,amt){const[r,g,b]=hexToRgb(hex);return rgbToHex(r+(255-r)*amt,g+(255-g)*amt,b+(255-b)*amt);}
function darken(hex,amt){const[r,g,b]=hexToRgb(hex);return rgbToHex(r*(1-amt),g*(1-amt),b*(1-amt));}

/* ---------- TEKSTUR PRE-RENDER (grain, vignette) ---------- */
function makeGrain(){const c=document.createElement('canvas');c.width=256;c.height=256;const g=c.getContext('2d');
 const img=g.createImageData(256,256);
 for(let i=0;i<img.data.length;i+=4){const v=Math.floor(hash(i*0.0013)*255);
  img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=22;}
 g.putImageData(img,0,0);return c;}
function makeVignette(){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 const grd=g.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);
 grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(0,0,0,0.42)');
 g.fillStyle=grd;g.fillRect(0,0,W,H);return c;}
const grainCanvas=makeGrain();
const vignetteCanvas=makeVignette();

/* =====================================================================
   PRIMITIF MATERIAL — clay, kertas, logam, kapur, kayu
   ===================================================================== */
function contactShadow(ctx,x,y,rx,alpha){ctx.save();ctx.fillStyle=`rgba(0,0,0,${alpha})`;ctx.beginPath();ctx.ellipse(x,y,rx,rx*0.26,0,0,TAU);ctx.fill();ctx.restore();}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function blobPath(ctx,x,y,rx,ry,seed,amp,points=16){ctx.beginPath();for(let i=0;i<=points;i++){const a=(i/points)*TAU;const r=1+(hash(seed+(i%points))-0.5)*amp;const px=x+Math.cos(a)*rx*r,py=y+Math.sin(a)*ry*r;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();}
function clayBlob(ctx,x,y,rx,ry,base,seed,rim){
 const g=ctx.createRadialGradient(x-rx*0.4,y-ry*0.45,rx*0.12,x,y,Math.max(rx,ry)*1.2);
 g.addColorStop(0,lighten(base,0.28));g.addColorStop(0.55,base);g.addColorStop(1,darken(base,0.32));
 blobPath(ctx,x,y,rx,ry,seed,0.06,16);ctx.fillStyle=g;ctx.fill();
 if(rim){ctx.save();ctx.globalAlpha=0.5;ctx.strokeStyle=rim;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,rx*0.96,ry*0.96,0,-2.5,-0.7);ctx.stroke();ctx.restore();}
}
function capsule(ctx,x1,y1,x2,y2,r,fill,seed){
 const g=ctx.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,lighten(fill,0.18));g.addColorStop(1,darken(fill,0.2));
 ctx.strokeStyle=g;ctx.lineWidth=r*2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function roughRectPath(ctx,x,y,w,h,seed,amp){
 const o=i=>(hash(seed+i)-0.5)*amp;
 ctx.beginPath();ctx.moveTo(x+o(0),y+o(1));ctx.lineTo(x+w+o(2),y+o(3));
 ctx.lineTo(x+w+o(4),y+h+o(5));ctx.lineTo(x+o(6),y+h+o(7));ctx.closePath();
}
function paperCard(ctx,x,y,w,h,fill,seed,rot=0){
 ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate(rot);
 ctx.save();ctx.fillStyle='rgba(0,0,0,0.28)';roughRectPath(ctx,-w/2+4,-h/2+6,w,h,seed+9,3);ctx.fill();ctx.restore();
 const g=ctx.createLinearGradient(-w/2,-h/2,w/2,h/2);g.addColorStop(0,lighten(fill,0.06));g.addColorStop(1,darken(fill,0.08));
 roughRectPath(ctx,-w/2,-h/2,w,h,seed,3);ctx.fillStyle=g;ctx.fill();
 ctx.save();ctx.globalAlpha=0.06;ctx.strokeStyle='#000';
 for(let i=0;i<5;i++){const yy=-h/2+(i+0.5)*h/5+(hash(seed+i)-0.5)*3;
  ctx.beginPath();ctx.moveTo(-w/2+3,yy);ctx.lineTo(w/2-3,yy+(hash(seed+i+5)-0.5)*4);ctx.stroke();}
 ctx.restore();
 ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1.2;roughRectPath(ctx,-w/2,-h/2,w,h,seed,3);ctx.stroke();
 ctx.restore();
}
function chalkText(ctx,text,x,y,size,align,color){
 align=align||'left';color=color||C.chalk;
 ctx.save();ctx.font=`700 ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';
 ctx.globalAlpha=0.92;ctx.fillStyle=color;ctx.fillText(text,x,y);
 ctx.globalAlpha=0.28;ctx.fillText(text,x+1,y+1);ctx.restore();
}
function chalkBox(ctx,x,y,w,h,seed){
 ctx.save();roughRectPath(ctx,x,y,w,h,seed,2.5);
 ctx.fillStyle='rgba(244,242,234,0.10)';ctx.fill();
 ctx.strokeStyle='rgba(244,242,234,0.85)';ctx.lineWidth=3;ctx.stroke();ctx.restore();
}
function plaque(ctx,x,y,text,o){o=o||{};const size=o.size||22;const pad=o.pad||14;
 ctx.save();ctx.font=`700 ${size}px ${FONT}`;const w=ctx.measureText(text).width+pad*2;const h=size+pad*1.4;
 const bg=o.bg||C.paper;const fg=o.fg||'#2a2118';const rot=o.rot||0;
 ctx.translate(x,y);ctx.rotate(rot);
 ctx.fillStyle='rgba(0,0,0,0.3)';roughRectPath(ctx,-w/2+3,-h/2+4,w,h,7,2);ctx.fill();
 const g=ctx.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,lighten(bg,0.08));g.addColorStop(1,darken(bg,0.1));
 roughRectPath(ctx,-w/2,-h/2,w,h,7,2);ctx.fillStyle=g;ctx.fill();
 ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=1.5;ctx.stroke();
 ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,0,1);
 ctx.restore();
}
function neonText(ctx,text,x,y,size,color){color=color||C.neon;ctx.save();
 ctx.font=`800 ${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.shadowColor=color;ctx.shadowBlur=18;ctx.fillStyle=color;ctx.fillText(text,x,y);
 ctx.shadowBlur=8;ctx.fillStyle='#eafffb';ctx.fillText(text,x,y);ctx.restore();
}
function rivet(ctx,x,y,r=3){const g=ctx.createRadialGradient(x-1,y-1,0.5,x,y,r);g.addColorStop(0,'#dfe5ea');g.addColorStop(1,'#4a545f');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}

/* ---------- LATAR & AMBIENCE ---------- */
function studioBg(ctx,wall,floor){
 let g=ctx.createLinearGradient(0,0,0,H*0.6);g.addColorStop(0,darken(wall,0.45));g.addColorStop(1,wall);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H*0.6);
 g=ctx.createLinearGradient(0,H*0.6,0,H);g.addColorStop(0,floor);g.addColorStop(1,darken(floor,0.5));
 ctx.fillStyle=g;ctx.fillRect(0,H*0.6,W,H*0.4);
 ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(0,H*0.6-1,W,2);
}
function dust(ctx,t,seed,count,color,alpha){
 for(let i=0;i<count;i++){const hx=hash(seed+i*3.7),hy=hash(seed+i*7.1);const sp=3+hash(seed+i)*7;
  const x=((hx*W)+t*sp)%W,y=((hy*H)+t*sp*0.35)%H;const r=0.5+hash(seed+i*1.7)*1.6;
  ctx.globalAlpha=alpha*(0.4+0.6*hash(seed+i*2.3));ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
 ctx.globalAlpha=1;
}
function spot(ctx,x,y,rx,alpha){const g=ctx.createRadialGradient(x,y,0,x,y,rx);
 g.addColorStop(0,`rgba(255,220,160,${alpha})`);g.addColorStop(1,'rgba(255,220,160,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rx,rx*0.5,0,0,TAU);ctx.fill();}

/* =====================================================================
   KARAKTER AGUNG — host clay, idle napas/blink/sway
   ===================================================================== */
function drawEyes(ctx,x,y,blink,look){const off=look*3;
 for(const sgn of[-1,1]){const ex=x+sgn*9+off*0.3,ey=y;
  if(blink){ctx.strokeStyle='#3a2a20';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ex-4,ey);ctx.lineTo(ex+4,ey);ctx.stroke();}
  else{ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,ey,5,5.5,0,0,TAU);ctx.fill();
   ctx.fillStyle='#2a2118';ctx.beginPath();ctx.arc(ex+off,ey+0.5,2.6,0,TAU);ctx.fill();
   ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.arc(ex+off-1,ey-1,0.9,0,TAU);ctx.fill();}}
}
function drawArm(ctx,sx,sy,ang,len,shirt,skin,seed){
 const ex=sx+Math.cos(ang)*len,ey=sy+Math.sin(ang)*len;
 capsule(ctx,sx,sy,sx+Math.cos(ang)*len*0.55,sy+Math.sin(ang)*len*0.55,8,shirt,seed);
 capsule(ctx,sx+Math.cos(ang)*len*0.45,sy+Math.sin(ang)*len*0.45,ex,ey,6.5,skin,seed+1);
 clayBlob(ctx,ex,ey,7,7,skin,seed+2);
}
function drawAgung(ctx,x,y,s,pose,t,seed){
 pose=pose||{};const jit=jitter(seed,t,1.0);
 const breath=1+Math.sin(t*2.2)*0.012;const sway=Math.sin(t*1.3)*0.015+(pose.sway||0);
 const shirt=pose.shirt||'#b85c3e',pants=pose.pants||'#39415a',skin=pose.skin||C.skin,hair=pose.hair||'#3a2a20';
 ctx.save();ctx.translate(x+jit.x,y+jit.y);ctx.rotate(sway);
 contactShadow(ctx,0,2,34*s,0.3);
 ctx.scale(s,s*breath);
 clayBlob(ctx,0,-16,26,16,pants,seed+1);
 clayBlob(ctx,0,-52,30,40,shirt,seed+2,'rgba(255,220,180,0.25)');
 const shL=[-26,-70],shR=[26,-70],armLen=34;
 const aL=pose.armL!==undefined?pose.armL:(Math.PI/2+0.25);
 const aR=pose.armR!==undefined?pose.armR:(Math.PI/2-0.25);
 drawArm(ctx,shL[0],shL[1],aL,armLen,shirt,skin,seed+3);
 drawArm(ctx,shR[0],shR[1],aR,armLen,shirt,skin,seed+4);
 const hx=0,hy=-108;
 clayBlob(ctx,hx,hy,23,24,skin,seed+5,'rgba(255,230,200,0.3)');
 clayBlob(ctx,hx,hy-12,22,12,hair,seed+6);
 clayBlob(ctx,hx-22,hy,5,6,skin,seed+7);clayBlob(ctx,hx+22,hy,5,6,skin,seed+8);
 const blink=(hash(Math.floor(t*3)+seed)>0.86)?1:0;
 drawEyes(ctx,hx,hy-2,blink,pose.look||0);
 ctx.strokeStyle=darken(hair,0.2);ctx.lineWidth=2.4;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(hx-14,hy-12);ctx.lineTo(hx-5,hy-13);ctx.stroke();
 ctx.beginPath();ctx.moveTo(hx+5,hy-13);ctx.lineTo(hx+14,hy-12);ctx.stroke();
 const talk=pose.talk||0;
 const mo=talk?(0.25+0.75*Math.abs(Math.sin(t*8)))*talk:(pose.mouth||0);
 ctx.fillStyle='#7a3b2e';ctx.beginPath();
 if(mo>0.15){ctx.ellipse(hx,hy+9,6,2+mo*5,0,0,TAU);}else{ctx.arc(hx,hy+8,6,0.15*Math.PI,0.85*Math.PI);}
 ctx.fill();ctx.restore();
}

/* =====================================================================
   PROP / SET PIECES
   ===================================================================== */
function drawPadlockDES(ctx,x,y,s,rot,t,seed){
 ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.scale(s,s);
 const j=jitter(seed,t,1.2);ctx.translate(j.x,j.y);
 ctx.strokeStyle='#6b4a33';ctx.lineWidth=9;ctx.lineCap='round';
 ctx.beginPath();ctx.arc(0,-34,20,Math.PI,0);ctx.stroke();
 const g=ctx.createLinearGradient(-26,-30,26,26);g.addColorStop(0,'#8a5a3a');g.addColorStop(0.5,'#6f4327');g.addColorStop(1,'#4e2d1a');
 roughRectPath(ctx,-26,-30,52,56,seed,3);ctx.fillStyle=g;ctx.fill();
 for(let i=0;i<7;i++){ctx.globalAlpha=0.35;ctx.fillStyle=hash(seed+i)>0.5?'#3f2413':'#9c6a3f';
  ctx.beginPath();ctx.arc((hash(seed+i*3)-0.5)*44,(hash(seed+i*7)-0.5)*48,2+hash(seed+i*11)*4,0,TAU);ctx.fill();}
 ctx.globalAlpha=1;
 ctx.fillStyle='#2a1a10';ctx.beginPath();ctx.arc(0,0,6,0,TAU);ctx.fill();ctx.fillRect(-2,0,4,12);
 ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=1.2;
 ctx.beginPath();ctx.moveTo(-18,-20);ctx.lineTo(-10,-8);ctx.lineTo(-16,4);ctx.stroke();
 ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=2;roughRectPath(ctx,-26,-30,52,56,seed,3);ctx.stroke();
 ctx.restore();
}
function drawSafeAES(ctx,x,y,s,t,seed,glow=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 const j=jitter(seed,t,0.8);ctx.translate(j.x,j.y);
 const w=150,h=170;
 let g=ctx.createLinearGradient(-w/2,-h,w/2,0);g.addColorStop(0,'#7d8894');g.addColorStop(0.5,'#55606c');g.addColorStop(1,'#39424d');
 roundRect(ctx,-w/2,-h,w,h,10);ctx.fillStyle=g;ctx.fill();
 ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=3;ctx.stroke();
 roundRect(ctx,-w/2+12,-h+12,w-24,h-24,7);
 g=ctx.createLinearGradient(0,-h,0,0);g.addColorStop(0,'#4a545f');g.addColorStop(1,'#333c46');
 ctx.fillStyle=g;ctx.fill();
 ctx.save();ctx.globalAlpha=0.9*glow;ctx.strokeStyle=C.neon;ctx.lineWidth=2.5;ctx.shadowColor=C.neon;ctx.shadowBlur=12;
 roundRect(ctx,-w/2+8,-h+8,w-16,h-16,8);ctx.stroke();ctx.restore();
 const cx=0,cy=-h*0.55;
 ctx.beginPath();ctx.arc(cx,cy,30,0,TAU);
 g=ctx.createRadialGradient(cx-8,cy-8,4,cx,cy,32);g.addColorStop(0,'#cfd6dd');g.addColorStop(1,'#5c6672');
 ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#2a3138';ctx.lineWidth=3;ctx.stroke();
 ctx.strokeStyle='#2a3138';ctx.lineWidth=2;
 for(let i=0;i<12;i++){const a=i/12*TAU+t*0.2;
  ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*22,cy+Math.sin(a)*22);ctx.lineTo(cx+Math.cos(a)*28,cy+Math.sin(a)*28);ctx.stroke();}

function sceneAt(t){for(let i=scenes.length-1;i>=0;i--){if(t>=scenes[i].start)return i;}return 0;}
function boundAt(t){for(const b of bounds){if(t>=b.at-TD/2&&t<=b.at+TD/2)return{b,p:(t-(b.at-TD/2))/TD};}return null;}
function irisCompose(ctx,A,B,p){
 const cx=W*0.5,cy=H*0.5,maxR=Math.hypot(W,H)*0.6;
 if(p<0.5){const r=(1-p*2)*maxR;
  ctx.drawImage(A,0,0);
  ctx.fillStyle='#000';ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(cx,cy,Math.max(r,0),0,TAU,true);ctx.fill();
 }else{const r=(p-0.5)*2*maxR;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.clip();ctx.drawImage(B,0,0);ctx.restore();}
}
function whipCompose(ctx,A,B,p){
 const off=p*W;
 ctx.drawImage(A,-off,0);ctx.drawImage(B,W-off,0);
 ctx.globalAlpha=0.25*Math.sin(Math.PI*p);ctx.fillStyle='#fff';
 for(let i=0;i<6;i++){const y=hash(i*7)*H;ctx.fillRect(0,y,W,2+hash(i)*3);}
 ctx.globalAlpha=1;
}
function dipCompose(ctx,A,B,p){
 if(p<0.5){ctx.drawImage(A,0,0);ctx.fillStyle=`rgba(0,0,0,${p*2})`;ctx.fillRect(0,0,W,H);}
 else{ctx.drawImage(B,0,0);ctx.fillStyle=`rgba(0,0,0,${(1-p)*2})`;ctx.fillRect(0,0,W,H);}
}
function wipeCompose(ctx,A,B,p,edgeColor){
 ctx.drawImage(A,0,0);
 const x=p*(W+120)-60;
 const jag=y=>(hash(Math.floor(y/20)*13.7)-0.5)*30;
 ctx.save();ctx.beginPath();ctx.moveTo(x+jag(0),0);
 for(let y=0;y<=H;y+=20){ctx.lineTo(x+jag(y),y);}
 ctx.lineTo(W,H);ctx.lineTo(W,0);ctx.closePath();ctx.clip();
 ctx.drawImage(B,0,0);ctx.restore();
 ctx.strokeStyle=edgeColor;ctx.lineWidth=6;ctx.globalAlpha=0.9;
 ctx.beginPath();ctx.moveTo(x+jag(0),0);
 for(let y=0;y<=H;y+=20){ctx.lineTo(x+jag(y),y);}
 ctx.stroke();ctx.globalAlpha=1;
}
function crossCompose(ctx,A,B,p){ctx.drawImage(A,0,0);ctx.globalAlpha=p;ctx.drawImage(B,0,0);ctx.globalAlpha=1;}
function compose(ctx,A,B,type,p){
 switch(type){
  case 'iris':irisCompose(ctx,A,B,p);break;
  case 'whip':whipCompose(ctx,A,B,p);break;
  case 'dip':dipCompose(ctx,A,B,p);break;
  case 'wipe':wipeCompose(ctx,A,B,p,C.chalk);break;
  case 'wipepaper':wipeCompose(ctx,A,B,p,'#e8dcc0');break;
  default:crossCompose(ctx,A,B,p);
 }
}

/* ---------- OVERLAY GLOBAL: vignette + grain + fade + watermark ---------- */
let grainPat=null;
function drawWatermark(ctx){
 ctx.save();ctx.font='600 16px '+FONT;ctx.textAlign='right';ctx.textBaseline='top';
 ctx.globalAlpha=0.6;ctx.fillStyle='#fff';
 ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=4;
 ctx.fillText('AI Gabut',W-20,18);ctx.restore();
}
function overlays(ctx,t){
 ctx.drawImage(vignetteCanvas,0,0);
 if(!grainPat)grainPat=ctx.createPattern(grainCanvas,'repeat');
 const gx=Math.floor(hash(Math.floor(t*24))*256),gy=Math.floor(hash(Math.floor(t*24)+9)*256);
 ctx.save();ctx.globalAlpha=0.55;ctx.translate(-gx,-gy);ctx.fillStyle=grainPat;
 ctx.fillRect(0,0,W+512,H+512);ctx.restore();
 const fadeIn=1-norm(t,0,0.4),fadeOut=norm(t,DURATION-0.5,DURATION);
 const blk=Math.max(fadeIn,fadeOut);
 if(blk>0){ctx.fillStyle=`rgba(0,0,0,${blk})`;ctx.fillRect(0,0,W,H);}
 drawWatermark(ctx);
}

/* =====================================================================
   RENDER UTAMA — fungsi murni dari t (deterministik)
   ===================================================================== */
function renderFrame(t){
 t=clamp(t,0,DURATION);
 const tr=boundAt(t);
 if(tr){
  scenes[tr.b.from].draw(octxA,t);
  scenes[tr.b.to].draw(octxB,t);
  compose(mainCtx,offA,offB,tr.b.type,easeInOutCubic(tr.p));
 }else{
  scenes[sceneAt(t)].draw(mainCtx,t);
 }
 overlays(mainCtx,t);
}
window.renderFrame=renderFrame;

/* ---------- PREVIEW LOKAL (tidak dipakai saat render Puppeteer) ---------- */
renderFrame(0);
let playing=(typeof navigator!=='undefined'&&!navigator.webdriver);
let t0=null;
function loop(ts){
 if(playing){if(t0===null)t0=ts;renderFrame(((ts-t0)/1000)%DURATION);}
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__setPlaying=v=>{playing=v;if(!v)t0=null;};
</script>
</body>
